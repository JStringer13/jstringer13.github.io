site_name: Jarrod Stringer Portfolio

theme:
  name: material
  language: en
  palette:
    primary: light blue
    accent: deep orange
  features:
    - content.tooltips
    - navigation.instant
    - navigation.tabs
    - toc.integrate

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - abbr
  - pymdownx.keys
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true 

extra_css:
  - stylesheets/extra.css

nav:
  - About Me:
      - index.md
  - Experience:
      - Overview: experience/experience.md
      - Masters:
          - Unix and Analysis of Large Genomic Datasets: experience/masters/Unix_and_Analysis_of_Large_Genomic_Datasets.md
          - Coding for Bioscientists: experience/masters/Coding_for_Bioscientists.md
          - Statistics for Biologists: experience/masters/Statistics_for_Biologists.md
      - Undergraduate:
          - Research: experience/undergraduate/research.md
          - Course Content: experience/undergraduate/course_content.md
      - Work Experience:
          - Chef: experience/work_experience/chef.md
          - Barista: experience/work_experience/barista.md
      - Hobbies:
          - Sports: experience/hobbies/sports.md