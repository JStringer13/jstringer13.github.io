site_name: Jarrod Stringer Portfolio

theme:
  name: material
  language: en
  palette:
    primary: teal
    accent: deep orange
  features:
    - content.tooltips
    - navigation.instant
    - navigation.tabs
    - toc.integrate

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - abbr
  - pymdownx.keys
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true 

extra_css:
  - stylesheets/extra.css

nav:
  - About Me: 
    - index.md

  - Experience:
    - Unix and Analysis of Large Genomic Datasets: experience/Unix_and_Analysis_of_Large_Genomic_Datasets.md
    - Git and GitHub: experience/Git_and_GitHub.md