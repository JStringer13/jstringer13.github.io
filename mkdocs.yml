site_name: Jarrod Stringer
site_url: https://jstringer13.github.io/
site_author: Jarrod Stringer
site_description: Biochemistry, programming and biological data analysis, alongside my studies, work experience and interests.

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/account-circle
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.tooltips
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - abbr
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JStringer13
      name: Jarrod Stringer on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jarrod-stringer-592a8819b/
      name: Jarrod Stringer on LinkedIn

nav:
  - About Me:
      - index.md
  - Experience:
      - Overview: experience/experience.md
      - Masters:
          - Overview: experience/masters/index.md
          - Unix and Analysis of Large Genomic Datasets: experience/masters/Unix_and_Analysis_of_Large_Genomic_Datasets.md
          - Coding for Bioscientists: experience/masters/Coding_for_Bioscientists.md
          - Statistics for Biologists: experience/masters/Statistics_for_Biologists.md
      - Undergraduate:
          - Overview: experience/undergraduate/index.md
          - Research: experience/undergraduate/research.md
          - Course Content: experience/undergraduate/course_content.md
      - Work Experience:
          - Overview: experience/work_experience/index.md
          - Chef: experience/work_experience/chef.md
          - Barista: experience/work_experience/barista.md
      - Hobbies:
          - Overview: experience/hobbies/index.md
          - Sports: experience/hobbies/sports.md